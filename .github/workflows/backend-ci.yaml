# I referenced Yash Jain's article [10] and theartofrain's response [11] for guidance on the CI/CD pipeline yaml file.
name: Backend Tests

on:
  push:
    branches: []
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ">=3.12"

      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync
          docker compose up -d

      - name: Run tests
        run: |
          uv run pytest

      - name: Lint with Ruff
        run: |
          uv run ruff check .
