name: Backend Tests

on:
  push:
    branches: [main, us-22-kaz-redis]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ">=3.12"

      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync
          docker compose up -d
          
      - name: Lint with Ruff
        run: |
          uv run pytest
          
      - name: Run tests
        run: |
          uv run ruff check .
