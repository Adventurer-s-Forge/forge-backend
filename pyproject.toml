[project]
name = "forge-backend"
version = "0.1.0"
description = "Adventurer's Forge backend: Redis data-access layer, rules engine, FastAPI server"
requires-python = ">=3.12"
dependencies = ["redis>=5.2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a reachable Redis (TEST_REDIS_URL, default redis://localhost:6379/15)"]

[tool.ruff]
line-length = 100
target-version = "py312"
